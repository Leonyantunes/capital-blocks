name: Deploy — GitHub Pages

# O repositório é público e tem Pages no plano gratuito: o deploy roda a cada
# push em `main` e publica em https://<user>.github.io/capital-blocks/
# As 5 suítes de teste rodam ANTES do build — nada quebra o deploy publicado.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 (não 20): o jsdom 30 usa `webidl.util.markAsUncloneable`, que só
          # existe a partir do Node 22. Com Node 20 a suíte morria em
          # "Test Files no tests" — mesmo sintoma que aparece local quando o
          # vitest roda logo após o build.
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Suíte Vitest (motor conceitual, empresarial, store, tours)
        run: npm test
      - name: Propriedades do voo da câmera 3D
        run: npm run test:globe
      - name: Enquadramento de rota (2D/3D, antimeridiano)
        run: npm run test:framing
      - name: Auditoria de integridade dos tours
        run: npm run test:tours

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Pages de projeto serve em /<repo>/ — assets via base; o SW deriva o
          # escopo da própria localização (public/ não é reescrito pelo Vite)
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
